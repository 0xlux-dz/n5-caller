name: n5-probe-scope
on:
  workflow_dispatch:
jobs:
  scope_probe:
    runs-on: ubuntu-latest
    steps:
      - name: r3_prefix
        id: r3
        uses: actions/cache/restore@v4
        with:
          key: n5-nokey-xyz2
          restore-keys: |
            n5-save--
          path: p3
      - run: |
          echo "PROBE_R3_MATCHED=${{ steps.r3.outputs.cache-matched-key }}"
          echo "PROBE_R3_HIT=${{ steps.r3.outputs.cache-hit }}"
