name: n5-probe-scope
on:
  workflow_dispatch:
jobs:
  scope_probe:
    runs-on: ubuntu-latest
    steps:
      - name: r3_short
        id: r3
        uses: actions/cache/restore@v4
        with:
          key: n5-nokey-xyz3
          restore-keys: |
            n5-
          path: p3
      - name: r4_seedprefix
        id: r4
        uses: actions/cache/restore@v4
        with:
          key: n5-nokey-xyz4
          restore-keys: |
            n5-seed-
          path: p4
      - run: |
          echo "R3M=${{ steps.r3.outputs['cache-matched-key'] }}"
          echo "R4M=${{ steps.r4.outputs['cache-matched-key'] }}"
