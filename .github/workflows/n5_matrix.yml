name: n5-matrix
on:
  workflow_dispatch:
jobs:
  c_read__y_read:
    cache-mode: read
    uses: 0xlux-dz/n5-callee/.github/workflows/callee_read.yml@main
    with: {pair_id: "${{ github.job }}"}
  c_read__y_write:
    cache-mode: read
    uses: 0xlux-dz/n5-callee/.github/workflows/callee_write.yml@main
    with: {pair_id: "${{ github.job }}"}
  c_read__y_writeonly:
    cache-mode: read
    uses: 0xlux-dz/n5-callee/.github/workflows/callee_writeonly.yml@main
    with: {pair_id: "${{ github.job }}"}
  c_read__y_none:
    cache-mode: read
    uses: 0xlux-dz/n5-callee/.github/workflows/callee_none.yml@main
    with: {pair_id: "${{ github.job }}"}
  c_read__y_inherit:
    cache-mode: read
    uses: 0xlux-dz/n5-callee/.github/workflows/callee_inherit.yml@main
    with: {pair_id: "${{ github.job }}"}
  c_write__y_inherit:
    cache-mode: write
    uses: 0xlux-dz/n5-callee/.github/workflows/callee_inherit.yml@main
    with: {pair_id: "${{ github.job }}"}
  c_write__y_read:
    cache-mode: write
    uses: 0xlux-dz/n5-callee/.github/workflows/callee_read.yml@main
    with: {pair_id: "${{ github.job }}"}
  c_write__y_none:
    cache-mode: write
    uses: 0xlux-dz/n5-callee/.github/workflows/callee_none.yml@main
    with: {pair_id: "${{ github.job }}"}
  c_none__y_write:
    cache-mode: none
    uses: 0xlux-dz/n5-callee/.github/workflows/callee_write.yml@main
    with: {pair_id: "${{ github.job }}"}
  c_writeonly__y_read:
    cache-mode: write-only
    uses: 0xlux-dz/n5-callee/.github/workflows/callee_read.yml@main
    with: {pair_id: "${{ github.job }}"}
